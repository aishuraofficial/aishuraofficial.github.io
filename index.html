<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AISHURA | Official Website</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Helvetica Neue",sans-serif}
body{background:#101014;color:#fff}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
main{position:relative;display:flex;width:100%;min-height:100vh;min-height:100dvh;overflow:hidden}
.world{width:50%;border:0;display:flex;align-items:center;justify-content:center;transition:filter .3s}
.black{background:#101014;color:#fff}.white{background:#fafaf8;color:#171717}
.world:active{filter:brightness(.8)}
.side{font-size:clamp(19px,5vw,48px);font-weight:300;letter-spacing:.02em;transform:translateY(-100px)}
.identity{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;text-align:center;pointer-events:none;mix-blend-mode:difference;color:white}
.identity h1{font-size:clamp(38px,10vw,110px);letter-spacing:.10em;margin:0;font-weight:600}
.identity p{font-size:clamp(11px,2.7vw,17px);letter-spacing:.08em;margin:20px 0 0}
.hint{position:absolute;bottom:8%;width:100%;text-align:center;font-size:11px;letter-spacing:.15em;mix-blend-mode:difference;color:white;pointer-events:none}
.page{min-height:100vh;min-height:100dvh;background:#101014;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.navigation{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;gap:12px;justify-content:space-between;padding:12px max(16px,calc((100vw - 1064px)/2)) calc(12px + env(safe-area-inset-bottom,0px));background:rgba(16,16,20,.96);border-top:1px solid #39393e}
.navbtn{flex:1;border:1px solid #777;padding:14px 12px;font-size:12px;font-weight:700;letter-spacing:.08em;min-height:48px}
.topback{background:#000;color:#fff}.oneback{background:#fff;color:#000}
.page-title{text-align:center;padding:25px 15px 30px}
.page-title h2{font-size:clamp(27px,6vw,55px);font-weight:400;letter-spacing:.12em;margin:0}
.page-title p{font-size:12px;letter-spacing:.1em;color:#aaa;margin-top:16px}
.content{max-width:1100px;margin:auto;padding:0 18px 70px}
.hero{width:100%;height:auto;display:block}
.members{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:30px}
.member{background:transparent;border:1px solid #666;color:white;padding:22px 5px;min-height:80px;transition:background .25s}
.member strong{display:block;font-size:clamp(14px,3vw,23px);letter-spacing:.12em}
.member span{display:block;font-size:12px;color:#aaa;margin-top:8px}
.member:active{background:#333}
.guide{text-align:center;color:#aaa;font-size:11px;letter-spacing:.2em;margin:25px 0}
.music-entry{display:block;width:100%;max-width:500px;margin:55px auto 0;background:#fff;color:#000;border:1px solid #fff;padding:24px;font-size:19px;font-weight:600;letter-spacing:.2em}
.music-entry span{display:block;font-size:10px;font-weight:400;letter-spacing:.15em;margin-top:9px}
.music-list{max-width:800px;margin:30px auto 0;padding:0 18px 70px}
.track{margin-bottom:55px}
.track h3{font-size:clamp(18px,4vw,27px);font-weight:400;letter-spacing:.08em;margin:0 0 18px}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#222}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* MEMBER SWIPE */
.member-stage{max-width:760px;margin:0 auto;padding:12px 0 30px}
.member-visual{display:block;width:100%;height:auto;max-height:72dvh;object-fit:contain;user-select:none;-webkit-user-drag:none}
.swipe-area{touch-action:pan-y;overflow:hidden}
.detail{text-align:center;padding:20px 16px 14px}
.detail h2{font-size:clamp(35px,8vw,80px);font-weight:300;letter-spacing:.14em;margin:0}
.detail .jp{font-size:18px;margin:12px 0;color:#bbb}
.detail .role{font-size:12px;letter-spacing:.25em;color:#888;margin:18px 0}
/* MEMBER PROFILE */
.profile{max-width:620px;margin:20px auto 34px;padding:0 22px}
.profile-heading{font-size:12px;font-weight:400;letter-spacing:.24em;color:#aaa;text-align:center;margin:0 0 24px}
.profile-facts{display:grid;grid-template-columns:110px 1fr;gap:0;margin:0;border-top:1px solid #39393e}
.profile-facts dt,.profile-facts dd{margin:0;padding:14px 8px;border-bottom:1px solid #39393e;font-size:14px;line-height:1.5}
.profile-facts dt{color:#999;letter-spacing:.08em}
.profile-facts dd{color:#fff}
.profile-description{margin:28px 0 0;font-size:14px;line-height:2.1;color:#ddd;white-space:pre-line}
.slide-controls{display:flex;justify-content:space-between;align-items:center;max-width:450px;margin:4px auto 0;padding:0 20px}
.slide-arrow{border:1px solid #777;background:#1b1b20;color:#fff;border-radius:50%;width:50px;height:50px;font-size:28px}
.slide-dots{display:flex;gap:12px;align-items:center}
.slide-dot{width:10px;height:10px;border:0;border-radius:50%;background:#666;padding:0}
.slide-dot.active{background:#fff}
.swipe-guide{text-align:center;font-size:10px;letter-spacing:.2em;color:#999;margin:20px 0}
.neo-intro{text-align:center;padding:70px 15px;color:#bbb;line-height:2}
@media(hover:hover){.world:hover{filter:brightness(.87)}.member:hover{background:#29292e}.navbtn:hover{opacity:.75}.music-entry:hover{background:#ddd}}
@media(max-width:480px){.navigation{gap:8px;padding-left:12px;padding-right:12px}.navbtn{font-size:11px}.content{padding:0 0 50px}.members{gap:6px;margin:22px 12px 0}.member{padding:18px 3px;min-height:75px}.member span{font-size:11px}.music-entry{width:calc(100% - 24px);margin-top:40px}.member-visual{max-height:65dvh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="home">
<button class="world black" onclick="openWorld('if')" aria-label="IFの世界"><span class="side">IF...</span></button>
<button class="world white" onclick="openWorld('neo')" aria-label="NEOの世界"><span class="side">...NEO</span></button>
<div class="identity"><h1>AISHURA</h1><p>鳴らせば、わかるかもしれない。</p></div>
<div class="hint">TOUCH A WORLD</div>
</main>
<section class="page" id="ifPage" hidden>
<header class="page-title"><h2>IF...AISHURA</h2><p>もしもから生まれた、最初の世界。</p></header>
<div class="content">
<img class="hero" src="4D32F8E3-B738-4AE7-995E-12735056C1C1.png" alt="AISHURA 小夜・宵・奇々の集合写真">
<div class="members">
<button class="member" onclick="openMember('sayo')"><strong>SAYO</strong><span>小夜</span></button>
<button class="member" onclick="openMember('yoi')"><strong>YOI</strong><span>宵</span></button>
<button class="member" onclick="openMember('kiki')"><strong>KIKI</strong><span>奇々</span></button>
</div>
<p class="guide">TOUCH A MEMBER</p>
<button class="music-entry" onclick="showPage('musicPage')">MUSIC<span>ENTER MUSIC</span></button>
</div>
<nav class="navigation"><button class="navbtn topback" onclick="goHome()">TOP BACK</button><button class="navbtn oneback" onclick="goHome()">ONE BACK</button></nav>
</section>
<section class="page" id="memberPage" hidden>
<div class="member-stage">
<div class="swipe-area" id="swipeArea">
<img id="memberImage" class="member-visual" src="" alt="AISHURA MEMBER" draggable="false">
<div class="detail"><h2 id="memberName"></h2><p class="jp" id="memberJapanese"></p><p class="role" id="memberRole"></p></div>
</div>
<div class="profile" aria-label="メンバープロフィール">
<h3 class="profile-heading">PROFILE</h3>
<dl class="profile-facts">
<dt>HEIGHT</dt><dd id="memberHeight"></dd>
<dt>AGE</dt><dd id="memberAge">不明</dd>
<dt>PART</dt><dd id="memberPart"></dd>
<dt>INSTRUMENT</dt><dd id="memberInstrument"></dd>
</dl>
<p class="profile-description" id="memberDescription"></p>
</div>
<div class="slide-controls">
<button class="slide-arrow" onclick="changeMember(-1)" aria-label="前のメンバー">&#8249;</button>
<div class="slide-dots" aria-label="メンバーを選択">
<button class="slide-dot" onclick="setMember(0)" aria-label="小夜"></button>
<button class="slide-dot" onclick="setMember(1)" aria-label="宵"></button>
<button class="slide-dot" onclick="setMember(2)" aria-label="奇々"></button>
</div>
<button class="slide-arrow" onclick="changeMember(1)" aria-label="次のメンバー">&#8250;</button>
</div>
<p class="swipe-guide">SWIPE TO EXPLORE</p>
</div>
<nav class="navigation"><button class="navbtn topback" onclick="goHome()">TOP BACK</button><button class="navbtn oneback" onclick="showPage('ifPage')">ONE BACK</button></nav>
</section>
<section class="page" id="musicPage" hidden>
<header class="page-title"><h2>MUSIC</h2></header>
<div class="music-list">
<div class="track"><h3>IF… WE PLAY</h3><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/IEl9rEQ6AU0" title="AISHURA - IF WE PLAY" loading="lazy" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div></div>
<div class="track"><h3>Smile</h3><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/euYRL8tTpAg" title="AISHURA - Smile" loading="lazy" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div></div>
<div class="track"><h3>Rella,umb,Rella</h3><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/JelC4iAOcOg" title="AISHURA - Rella,umb,Rella" loading="lazy" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div></div>
<div class="track"><h3>灰華</h3><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/bZ6Knkd46tI" title="AISHURA - 灰華" loading="lazy" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div></div>
<div class="track"><h3>BURST BEYOND</h3><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/jTPQBvMP2QM" title="AISHURA - BURST BEYOND" loading="lazy" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div></div>
</div>
<nav class="navigation"><button class="navbtn topback" onclick="goHome()">TOP BACK</button><button class="navbtn oneback" onclick="showPage('ifPage')">ONE BACK</button></nav>
</section>
<section class="page" id="neoPage" hidden>
<header class="page-title"><h2>AISHURA...NEO</h2><p>次の世界へ。AISHURAは進化する。</p></header>
<div class="neo-intro">COMING SOON</div>
<nav class="navigation"><button class="navbtn topback" onclick="goHome()">TOP BACK</button><button class="navbtn oneback" onclick="goHome()">ONE BACK</button></nav>
</section>
<script>
const pages=['home','ifPage','memberPage','musicPage','neoPage'];
const memberData=[
{name:'SAYO',jp:'小夜',role:'BASS',image:'SAYO.jpg.PNG',height:'178cm',part:'Bass（レフティ）',instrument:'月影',description:'増女をモチーフにした面をつけている。その理由は詳細不明。\n月影をこよなく愛す。'},
{name:'YOI',jp:'宵',role:'VOCAL',image:'YOI.jpg.PNG',height:'155cm',part:'Vocal',instrument:'cry / humble',description:'天狗をモチーフにした面を首から背中側にかけている。天狗にならないようにするための戒めらしい。\nシャウトはあまりしたくないらしい。'},
{name:'KIKI',jp:'奇々',role:'GUITAR',image:'KIKI.jpg.PNG',height:'180cm',part:'Guitar',instrument:'黒牙 / 静刃',description:'般若をモチーフにした面をつけている。その理由は詳細不明。\n常に「雷撃」というコードを探している。'}
];
let memberIndex=0;
function showPage(id){pages.forEach(page=>{document.getElementById(page).hidden=page!==id});window.scrollTo(0,0)}
function openWorld(which){showPage(which==='if'?'ifPage':'neoPage')}
function setMember(index){memberIndex=(index+memberData.length)%memberData.length;const member=memberData[memberIndex];document.getElementById('memberName').textContent=member.name;document.getElementById('memberJapanese').textContent=member.jp;document.getElementById('memberRole').textContent=member.role;document.getElementById('memberHeight').textContent=member.height;document.getElementById('memberAge').textContent='不明';document.getElementById('memberPart').textContent=member.part;document.getElementById('memberInstrument').textContent=member.instrument;document.getElementById('memberDescription').textContent=member.description;const photo=document.getElementById('memberImage');photo.src=member.image;photo.alt='AISHURA '+member.name;document.querySelectorAll('.slide-dot').forEach((dot,i)=>{dot.classList.toggle('active',i===memberIndex);dot.setAttribute('aria-current',i===memberIndex?'true':'false')})}
function changeMember(direction){setMember(memberIndex+direction)}
function openMember(which){const index={sayo:0,yoi:1,kiki:2}[which];if(index===undefined)return;setMember(index);showPage('memberPage')}
function goHome(){showPage('home')}
const swipeArea=document.getElementById('swipeArea');let touchStartX=0,touchStartY=0;
swipeArea.addEventListener('touchstart',event=>{const touch=event.changedTouches[0];touchStartX=touch.clientX;touchStartY=touch.clientY},{passive:true});
swipeArea.addEventListener('touchend',event=>{const touch=event.changedTouches[0];const dx=touch.clientX-touchStartX;const dy=touch.clientY-touchStartY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2){changeMember(dx<0?1:-1)}},{passive:true});
</script>
</body>
</html>
